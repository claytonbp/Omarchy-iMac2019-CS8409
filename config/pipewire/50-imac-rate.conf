# iMac19,1 speakers (cs8409-apple): the CS8409 speaker clocks are set up for
# 44.1 kHz, Apple's rate. At 48 kHz the sound is distorted, so let PipeWire
# run at 44.1 kHz only and resample everything else.
# Install to: ~/.config/pipewire/pipewire.conf.d/50-imac-rate.conf
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 ]
}
