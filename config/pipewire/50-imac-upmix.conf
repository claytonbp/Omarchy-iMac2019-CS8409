# Tested on the iMac19,1 (4 Nov 2026): all four channels carry stereo; rear -3 dB.
# Copy stereo to all four speakers (tweeters on FL/FR, woofers on RL/RR)
# when the card uses its 4-channel "Analog Surround 4.0" profile.
# Install to BOTH:
#   ~/.config/pipewire/client.conf.d/50-imac-upmix.conf
#   ~/.config/pipewire/pipewire-pulse.conf.d/50-imac-upmix.conf
stream.properties = {
    channelmix.upmix        = true
    channelmix.upmix-method = simple
}
