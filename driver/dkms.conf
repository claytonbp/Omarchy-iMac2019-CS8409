PACKAGE_NAME="cs8409-apple"
PACKAGE_VERSION="0.9"
BUILT_MODULE_NAME[0]="snd-hda-codec-cs8409"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
AUTOINSTALL="yes"
# The driver bundles private HDA headers from Linux 7.2.15. They were checked to
# be compatible with 7.2 and 7.3 (build-tested against 7.3.1). On any other
# kernel DKMS skips the build, and the stock driver loads instead of a module
# built with out-of-date headers. See INSTALL.md, "Kernel updates".
BUILD_EXCLUSIVE_KERNEL="^7\.[23]([.-]|$)"
